[package]
name = "schemashrink"
version = "0.1.0"
edition = "2021"
description = "Zero-latency lossless JSON Schema & Tool Definition compressor for LLM agent runtimes with deterministic prefix caching stabilization."
license = "MIT"
authors = ["byzorky1-sudo (Ali) <byzorky1@users.noreply.github.com>"]
repository = "https://github.com/byzorky1-sudo/schemashrink"
homepage = "https://github.com/byzorky1-sudo/schemashrink"
readme = "README.md"
keywords = ["llm", "json-schema", "tool-calling", "agent", "prompt-caching"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
regex = "1.10"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
